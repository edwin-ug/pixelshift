<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="690" height="150" fill="none">
  <defs>
    <linearGradient id="psGoldOchre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A900"/>
      <stop offset="100%" stop-color="#CC6F00"/>
    </linearGradient>
    <linearGradient id="psOchreEspresso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC6F00"/>
      <stop offset="100%" stop-color="#4D2A00"/>
    </linearGradient>
    <filter id="psDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4D2A00" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left Emblem: Isometric Shifting Pixel Matrix -->
  <g transform="translate(10, 15)" filter="url(#psDrop)">
    <!-- Base Solid Column (Espresso #4D2A00) -->
    <rect x="0" y="0" width="20" height="20" rx="4.5" fill="#4D2A00"/>
    <rect x="0" y="26" width="20" height="20" rx="4.5" fill="#4D2A00"/>
    <rect x="0" y="52" width="20" height="20" rx="4.5" fill="#4D2A00"/>

    <!-- Middle Column (Gradients) -->
    <rect x="26" y="0" width="20" height="20" rx="4.5" fill="url(#psOchreEspresso)"/>
    <rect x="26" y="26" width="20" height="20" rx="4.5" fill="url(#psGoldOchre)"/>

    <!-- Right Column (Amber & Shifted Pixels) -->
    <rect x="52" y="0" width="20" height="20" rx="4.5" fill="#F2A900"/>
    <rect x="52" y="26" width="20" height="20" rx="4.5" fill="#CC6F00"/>

    <!-- Dynamically Shifted Pixels -->
    <rect x="54" y="54" width="18" height="18" rx="3.5" fill="#CC6F00"/>
    <rect x="78" y="36" width="14" height="14" rx="3" fill="#F2A900"/>
    <rect x="76" y="12" width="12" height="12" rx="2.5" fill="#F9E6A8" stroke="#CC6F00" stroke-width="1.5"/>
    <rect x="94" y="24" width="9" height="9" rx="2" fill="#4D2A00"/>
  </g>

  <!-- Wordmark: pixelshift with Chromatic Shifted X -->
  <g transform="translate(132, 67)">
    <!-- 'pi' -->
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="48" letter-spacing="-0.03em" fill="#4D2A00" class="ps-text-base">pi</text>

    <!-- Shifting 'x' Pixel Mosaic -->
    <g transform="translate(48, -40)">
      <!-- Central X matrix of 7x7px pixel tiles with brand palette -->
      <!-- Center -->
      <rect x="18" y="18" width="9" height="9" rx="1.5" fill="#CC6F00"/>
      <!-- Diagonal Top-Left to Bottom-Right -->
      <rect x="8" y="8" width="9" height="9" rx="1.5" fill="#F2A900"/>
      <rect x="0" y="0" width="8" height="8" rx="1.5" fill="#F9E6A8" stroke="#CC6F00" stroke-width="1"/>
      <rect x="28" y="28" width="9" height="9" rx="1.5" fill="#CC6F00"/>
      <rect x="38" y="38" width="8" height="8" rx="1.5" fill="#4D2A00"/>
      
      <!-- Diagonal Bottom-Left to Top-Right -->
      <rect x="8" y="28" width="9" height="9" rx="1.5" fill="#F2A900"/>
      <rect x="0" y="38" width="8" height="8" rx="1.5" fill="#4D2A00"/>
      <rect x="28" y="8" width="9" height="9" rx="1.5" fill="#F2A900"/>
      
      <!-- Shift Scatter Particles (Moving Up-Right) -->
      <rect x="38" y="-2" width="7" height="7" rx="1.5" fill="#F2A900"/>
      <rect x="48" y="-12" width="6" height="6" rx="1" fill="#CC6F00"/>
      <rect x="44" y="10" width="6" height="6" rx="1" fill="#F9E6A8" stroke="#CC6F00" stroke-width="0.8"/>
      <rect x="56" y="-4" width="5" height="5" rx="1" fill="#F2A900"/>
    </g>

    <!-- 'elshift' -->
    <text x="108" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="48" letter-spacing="-0.03em">
      <tspan fill="#4D2A00" class="ps-text-base">el</tspan>
      <tspan fill="#CC6F00">shift</tspan>
    </text>

    <!-- Precision accent dot above the 'i' in shift -->
    <circle cx="223" cy="-35" r="5.5" fill="#F2A900"/>
  </g>
</svg>